[package]
name = "open-ew-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
crc32fast = "1.4"
rayon = "1.10"
lzma-rs = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
