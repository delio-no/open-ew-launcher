name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: open-ew-launcher
            archive_name: open-ew-launcher-linux-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: open-ew-launcher.exe
            archive_name: open-ew-launcher-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}
          cp ${{ matrix.bin_name }} ../../../${{ matrix.bin_name }}

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath ../../../${{ matrix.archive_name }} -Force
          Copy-Item ${{ matrix.bin_name }} ../../../${{ matrix.bin_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.bin_name }}

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          sha256sum open-ew-launcher* > SHA256SUMS.txt
          echo "### SHA256 Checksums" > checksums_body.md
          echo '```' >> checksums_body.md
          cat SHA256SUMS.txt >> checksums_body.md
          echo '```' >> checksums_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/open-ew-launcher*
            release-artifacts/SHA256SUMS.txt
          body_path: release-artifacts/checksums_body.md
          generate_release_notes: true
